services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zk
      POSTGRES_PASSWORD: zk
      POSTGRES_DB: zk
    ports:
      - "127.0.0.1:${ZK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zk -d zk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "127.0.0.1:${ZK_API_PORT:-8000}:8000"
    environment:
      ZK_DATABASE_URL: postgresql+asyncpg://zk:zk@db:5432/zk
      ZK_DATA_DIR: /data/zettelkasten
      ZK_WHISPER_MODEL: ${ZK_WHISPER_MODEL:-base}
      ZK_WHISPER_CACHE_DIR: /models
      ZK_MAX_UPLOAD_MB: ${ZK_MAX_UPLOAD_MB:-100}
      ZK_MAX_MEDIA_SECONDS: ${ZK_MAX_MEDIA_SECONDS:-7200}
      ZK_CORS_ORIGINS: '${ZK_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}'
      ZK_INTELLIGENCE_ENABLED: ${ZK_INTELLIGENCE_ENABLED:-true}
      ZK_OLLAMA_BASE_URL: ${ZK_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ZK_LLM_MODEL: ${ZK_LLM_MODEL:-qwen2.5:7b}
      ZK_EMBED_MODEL: ${ZK_EMBED_MODEL:-nomic-embed-text}
      ZK_INTELLIGENCE_CHUNK_CHARS: ${ZK_INTELLIGENCE_CHUNK_CHARS:-3000}
      ZK_INTELLIGENCE_TIMEOUT_SECONDS: ${ZK_INTELLIGENCE_TIMEOUT_SECONDS:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zk-data:/data/zettelkasten
      - whisper-models:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  zk-data:
  whisper-models:
